  </g>
  <!-- Text Label -->
  <text x="80" y="136" text-anchor="middle" font-family="Vazirmatn, Tahoma, sans-serif" font-size="10.5" font-weight="bold" fill="#065F46">نشان ملی ثبت</text>
  <text x="80" y="152" text-anchor="middle" font-family="Vazirmatn, Tahoma, sans-serif" font-size="8.5" fill="#475569">رسانه‌های دیجیتال</text>
